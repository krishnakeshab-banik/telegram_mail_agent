[project]
name = "executive-agent"
version = "1.0.0"
description = "Personal executive agent delivered as a Telegram bot."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/versions/*.py" = ["E402", "I001"]
"app/db/migrations/env.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
strict = true
warn_unused_ignores = false
disallow_untyped_defs = true
no_implicit_optional = true
plugins = []
exclude = ["app/db/migrations", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "google.*", "google.genai.*", "telegram.*", "bs4.*", "docx.*", "pypdf.*", "openpyxl.*"]
ignore_missing_imports = true
