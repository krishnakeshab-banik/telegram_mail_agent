services:
  agent:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
